[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "paid"
version = "1.2.1"
description = "Personal AI Delegate — Hermes plugin that authorises an AI to handle a class of your IM messages with an approval gate."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
authors = [{name = "PAID contributors"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "httpx>=0.24",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/jimmyag2026-prog/paid-plugin"
Issues = "https://github.com/jimmyag2026-prog/paid-plugin/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["paid*"]
exclude = ["tests*"]
